# .github/workflows/main.yml
name: Instagram Bot Scheduler

on:
  # ⬇️ تنظیم زمانبندی: هر 30 دقیقه یک بار اجرا می شود
  schedule:
    - cron: '*/30 * * * *'
  # امکان اجرای دستی
  workflow_dispatch:

jobs:
  run_bot:
    runs-on: ubuntu-latest
    steps:
    
      # 1. دریافت کد از مخزن
      - name: Checkout repository
        uses: actions/checkout@v4
        
      # 2. نصب پایتون
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 3. نصب کتابخانه های مورد نیاز از فایل requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # ⚠️ مسیر دهی به فایل requirements.txt در داخل پوشه jav
          pip install -r jav/requirements.txt
          
      # 4. اجرای ربات
      # در این حالت، متغیرها مستقیما از داخل inhack.py خوانده می شوند.
      - name: Run the Instagram Bot
        run: |
          # ⚠️ مسیر دهی به فایل inhack.py در داخل پوشه jav
          python jav/inhack.py
